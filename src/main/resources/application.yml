server:
  port: 8082

spring:
  application:
    name: hiemdall

app:
  google:
    client-id:     ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    auth-uri:      https://accounts.google.com/o/oauth2/v2/auth
    token-uri:     https://oauth2.googleapis.com/token
    redirect-uri:  ${APP_OAUTH_REDIRECT_URI:http://localhost:3000/api/auth/google/callback}
    scopes:
      - openid
      - email
      - profile
      - https://www.googleapis.com/auth/gmail.readonly

  internal:
    # Shared secret sent by other services as X-Internal-Auth on /internal/** calls.
    svc-token: ${INTERNAL_SVC_TOKEN:dev-internal-token-change-me}

  # Default registry for local dev. Prod values come from an external file merged in via
  # SPRING_CONFIG_IMPORT (see docker-compose.yml).
  registered-apps:
    kkt:
      app-name:           KharchaKhata
      post-auth-redirect: http://localhost:3000/dashboard

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
