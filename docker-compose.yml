# hiemdall — local/dev Compose stack.
#
# Config values that vary per host (paths, secrets) come from .env (see .env.example).
# The registered-apps registry is mounted as an external file and merged into Spring's
# property tree via SPRING_CONFIG_IMPORT.

services:
  hiemdall:
    # Pulled from the registry — publish with ./docker_build.sh --push first.
    # Override tag per env via HIEMDALL_IMAGE_TAG; `latest` is fine for local dev.
    image: obake/hiemdall:${HIEMDALL_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: hiemdall
    ports:
      - "${HIEMDALL_HOST_PORT:-9082}:9082"
    volumes:
      # Host file bind-mounted read-only. Container path is the contract; host path is per-env.
      - ${HIEMDALL_CONFIG_DIR:-./config}/registered-apps.yaml:/config/registered-apps.yaml:ro
    environment:
      # Merge the external registry file into Spring config. Drop `optional:` to fail fast
      # if the file is missing.
      SPRING_CONFIG_IMPORT: optional:file:/config/registered-apps.yaml

      # Secrets and per-env overrides sourced from .env.
      GOOGLE_CLIENT_ID:        ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET:    ${GOOGLE_CLIENT_SECRET}
      APP_OAUTH_REDIRECT_URI:  ${APP_OAUTH_REDIRECT_URI}
      INTERNAL_SVC_TOKEN:      ${INTERNAL_SVC_TOKEN}
# When downstream services (STASH user_engine, etc.) join this stack, add:
#   networks: [tb-shared]  on the service and
#   networks: { tb-shared: { external: true } }  at the file bottom,
# then `docker network create tb-shared` once on the host.
# Standalone compose uses the default bridge network created automatically.
